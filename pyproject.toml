[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hackit"
version = "0.1.0"
description = "A Python project."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Siphosihlemorabe", email = "siphosim9@gmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
hackit = "hackit.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hackit"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
